<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيقي</title>
  
  <!-- مكتبة Tailwind CSS للتنسيق -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- مكتبات React 18 و ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel لمعالجة كود JSX داخل المتصفح -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- خط Cairo العربي -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- عنصر الجذور الخاص برياكت -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- كود التطبيق المكتوب بـ React -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [count, setCount] = useState(0);

      return (
        <div class="flex-1 flex items-center justify-center p-4">
          <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm w-full space-y-5 border border-slate-200">
            
            <div class="w-16 h-16 bg-violet-100 text-violet-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
              📱
            </div>

            <h1 class="text-2xl font-bold text-violet-700">تطبيقك جاهز!</h1>
            <p class="text-slate-500 text-sm leading-relaxed">
              هذا هو القالب الكامل للتطبيق. يمكنك تعديل الواجهة وإضافة ميزاتك هنا مباشرة.
            </p>

            <div class="bg-violet-50 p-4 rounded-xl border border-violet-100">
              <span class="block text-xs font-semibold text-violet-600 mb-1">العداد التجريبي</span>
              <span class="text-4xl font-extrabold text-violet-800">{count}</span>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
              <button 
                onClick={() => setCount(count + 1)}
                class="bg-violet-600 hover:bg-violet-700 active:scale-95 text-white font-bold py-2.5 px-4 rounded-xl shadow transition duration-150"
              >
                زيادة +
              </button>
              
              <button 
                onClick={() => setCount(0)}
                class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 font-bold py-2.5 px-4 rounded-xl transition duration-150"
              >
                تصفير
              </button>
            </div>

          </div>
        </div>
      );
    }

    // تشغيل التطبيق داخل عنصر root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
